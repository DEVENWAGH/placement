{% extends 'base.html' %} {% block content %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>{% block title %} {% endblock %}- FlaskApp</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='home.css') }}">

  </head>

  <body>
    <div class="container1">
      <div class="card1">
        <div class="imgBx">
          <img
            src="https://img.freepik.com/free-vector/fill-out-concept-illustration_114360-5450.jpg?w=740&t=st=1668258982~exp=1668259582~hmac=aac03dfc8eacc2c04fb6efe04f678cc6991144ac1581cb41863e94b4a0eca862"
            class="img-fluid"
          />
        </div>
        <div class="content">
          <h5 class="card-title">Fill Details</h5>
          <p class="card-text">You can fill your basic details here.</p>

          <a href="/create/" class="btn btn-primary">Button</a>
        </div>
      </div>

      <div class="card2">
        <div class="imgBx">
          <img
            src="https://img.freepik.com/free-vector/employees-cv-candidates-resume-corporate-workers-students-id-isolate-flat-design-element-job-applications-avatars-personal-information_335657-2605.jpg?w=740&t=st=1668259049~exp=1668259649~hmac=3813f784c2ae6608e53b1185b4199ef4f479cc242c23099cccdada2918db581d"
            class="img-fluid"
          />
        </div>
        <div class="content">
          <h5 class="card-title">View Profile</h5>
          <p class="card-text">You can view the details you entered here.</p>
          <a href="/view/" class="btn btn-primary">Button</a>
        </div>
      </div>

      <div class="card3">
        <div class="imgBx">
          <img
            src="https://img.freepik.com/free-vector/man-having-online-job-interview_52683-43379.jpg?w=740&t=st=1668259580~exp=1668260180~hmac=b500f8d435f89d0b96e1a4a741886f29cb16437b4074bccd41c31bb66f77acc9"
            class="img-fluid"
          />
        </div>
        <div class="content">
          <h5 class="card-title">View Jobs</h5>
          <p class="card-text">You can view the upcoming Jobs here.</p>
          <a href="/view_jobs" class="btn btn-primary">Button</a>
        </div>
      </div>
    </div>
  </body>
</html>

{% endblock %}
