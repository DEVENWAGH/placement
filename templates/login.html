{% extends 'base.html' %} {% block content %}
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlacementHub - Login</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='loginadmin.css') }}"
    />
    <style>
      .alert-warning {
        background-color: #f8d7da;
        color: #721c24;
        padding: 10px;
        border-radius: 5px;
        margin-top: 15px;
        border: 1px solid #f5c6cb;
      }

      .admin-login-form {
        min-height: 500px;
        width: 100%;
        max-width: 500px;
        padding: 50px 35px;
        box-sizing: border-box;
      }

      .btn {
        margin-top: 20px;
      }

      label {
        margin-top: 15px;
      }

      /* Responsive styles */
      @media (max-width: 768px) {
        .container {
          padding-top: 20px;
        }

        .admin-login-form {
          min-height: auto;
          padding: 30px 25px;
        }

        h3 {
          font-size: 24px;
          margin-bottom: 20px;
        }

        .background .shape {
          height: 150px;
          width: 150px;
        }
      }

      @media (max-width: 576px) {
        .admin-login-form {
          padding: 20px 15px;
        }

        h3 {
          font-size: 22px;
          margin-bottom: 15px;
        }

        input {
          height: 45px;
        }

        .btn {
          padding: 12px 0;
          font-size: 16px;
        }

        .background {
          display: none; /* Hide shapes on very small screens */
        }

        .col-md-6 {
          padding: 0 10px;
        }
      }

      /* Fix for small height screens */
      @media (max-height: 600px) {
        .admin-login-form {
          min-height: auto;
          padding-top: 20px;
          padding-bottom: 20px;
        }

        label {
          margin-top: 10px;
        }

        .btn {
          margin-top: 15px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="row">
        <div class="col-md-6 mx-auto">
          <div class="login-box">
            <div class="background">
              <div class="shape"></div>
              <div class="shape"></div>
            </div>
            <form
              class="admin-login-form"
              action="{{ url_for('login') }}"
              method="post"
            >
              <h3>Login to PlacementHub</h3>
              <label for="username">Username or Email</label>
              <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter Username or Email"
                required
              />
              <label for="password">Password</label>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                required
              />
              <button type="submit" class="btn btn-primary">Login</button>

              <div class="text-center mt-3">
                <p style="margin-top: 20px; color: black">
                  Don't have an account?
                  <a href="{{ url_for('register') }}">Register here</a>
                </p>
              </div>

              {% with messages = get_flashed_messages() %} {% if messages %} {%
              for message in messages %}
              <div class="alert alert-warning mt-3">{{ message }}</div>
              {% endfor %} {% endif %} {% endwith %}
            </form>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
{% endblock %}
